<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" font-family="Inter, Segoe UI, Arial, sans-serif">
  <!-- System architecture, based on the group paper and PP1/PP2 slides. Replace with your own diagram if you have one, and update methodology.diagram in js/data.js -->
  <defs>
    <linearGradient id="comp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#eceefa" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#8b8fd6"/>
    </marker>
  </defs>

  <rect width="960" height="580" fill="#ffffff"/>
  <rect width="960" height="580" fill="url(#grid)"/>

  <text x="480" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#12122b">System Architecture</text>
  <text x="480" y="64" text-anchor="middle" font-size="13" fill="#82859f">Three risk signals, each explained, fused into one alert for the advisor</text>

  <!-- connectors -->
  <g stroke="#8b8fd6" stroke-width="2" fill="none">
    <path d="M190 152v30" marker-end="url(#arrow)"/>
    <path d="M480 152v30" marker-end="url(#arrow)"/>
    <path d="M770 152v30" marker-end="url(#arrow)"/>
    <path d="M190 260v12"/>
    <path d="M480 260v12"/>
    <path d="M770 260v12"/>
    <path d="M190 302v36" marker-end="url(#arrow)"/>
    <path d="M480 302v36" marker-end="url(#arrow)"/>
    <path d="M770 302v36" marker-end="url(#arrow)"/>
    <path d="M300 392v36" marker-end="url(#arrow)"/>
    <path d="M480 469h76" marker-end="url(#arrow)"/>
  </g>

  <g text-anchor="middle">
    <!-- data sources -->
    <rect x="60" y="92" width="260" height="60" rx="14" fill="#f4f4fd" stroke="#c7c9f5" stroke-width="1.5"/>
    <text x="190" y="118" font-size="15" font-weight="600" fill="#12122b">Academic Records</text>
    <text x="190" y="138" font-size="12" fill="#5b5e7a">17 weeks of assessments and VLE activity</text>

    <rect x="350" y="92" width="260" height="60" rx="14" fill="#f4f4fd" stroke="#c7c9f5" stroke-width="1.5"/>
    <text x="480" y="118" font-size="15" font-weight="600" fill="#12122b">Student Text</text>
    <text x="480" y="138" font-size="12" fill="#5b5e7a">Forum posts, reflections, messages</text>

    <rect x="640" y="92" width="260" height="60" rx="14" fill="#f4f4fd" stroke="#c7c9f5" stroke-width="1.5"/>
    <text x="770" y="118" font-size="15" font-weight="600" fill="#12122b">LMS Interaction Logs</text>
    <text x="770" y="138" font-size="12" fill="#5b5e7a">Clicks, logins, quizzes, resources</text>

    <!-- component models -->
    <rect x="60" y="186" width="260" height="74" rx="14" fill="url(#comp)"/>
    <text x="190" y="206" font-size="10" font-weight="700" letter-spacing="1.2" fill="#c7c9f5">COMPONENT 1</text>
    <text x="190" y="228" font-size="15" font-weight="600" fill="#ffffff">Academic Trend Detection</text>
    <text x="190" y="248" font-size="12" fill="#e0e0ff">Unified multi-horizon GRU + attention</text>

    <rect x="350" y="186" width="260" height="74" rx="14" fill="url(#comp)"/>
    <text x="480" y="206" font-size="10" font-weight="700" letter-spacing="1.2" fill="#c7c9f5">COMPONENT 2</text>
    <text x="480" y="228" font-size="15" font-weight="600" fill="#ffffff">Emotional Signal Analysis</text>
    <text x="480" y="248" font-size="12" fill="#e0e0ff">BERT + RoBERTa ensemble · 7 classes</text>

    <rect x="640" y="186" width="260" height="74" rx="14" fill="url(#comp)"/>
    <text x="770" y="206" font-size="10" font-weight="700" letter-spacing="1.2" fill="#c7c9f5">COMPONENT 3</text>
    <text x="770" y="228" font-size="15" font-weight="600" fill="#ffffff">Behavioural Pattern Recognition</text>
    <text x="770" y="248" font-size="12" fill="#e0e0ff">Variational Autoencoder (VAE)</text>

    <!-- outputs + explanations -->
    <rect x="70" y="272" width="240" height="30" rx="15" fill="#ffffff" stroke="#c7c9f5" stroke-width="1.5"/>
    <text x="190" y="292" font-size="12" fill="#4c1d95">Week 4 / 8 / 12 / 17 risk · 3-level XAI</text>

    <rect x="360" y="272" width="240" height="30" rx="15" fill="#ffffff" stroke="#c7c9f5" stroke-width="1.5"/>
    <text x="480" y="292" font-size="12" fill="#4c1d95">Distress score · attention heatmap</text>

    <rect x="650" y="272" width="240" height="30" rx="15" fill="#ffffff" stroke="#c7c9f5" stroke-width="1.5"/>
    <text x="770" y="292" font-size="12" fill="#4c1d95">Anomaly score · SHAP explanation</text>

    <!-- API -->
    <rect x="60" y="342" width="840" height="50" rx="14" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1.5"/>
    <text x="480" y="373" font-size="15" font-weight="600" fill="#4c1d95">REST API · risk signals from all components</text>

    <!-- fusion + dashboard -->
    <rect x="120" y="432" width="360" height="74" rx="14" fill="url(#comp)"/>
    <text x="300" y="452" font-size="10" font-weight="700" letter-spacing="1.2" fill="#c7c9f5">COMPONENT 4</text>
    <text x="300" y="474" font-size="15" font-weight="600" fill="#ffffff">Meta-Integration FNN</text>
    <text x="300" y="494" font-size="12" fill="#e0e0ff">Fuses all signals into one calibrated risk score</text>

    <rect x="560" y="432" width="320" height="74" rx="14" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
    <text x="720" y="462" font-size="15" font-weight="600" fill="#065f46">Advisor Dashboard</text>
    <text x="720" y="484" font-size="12" fill="#047857">HIGH / MEDIUM / LOW alert + reasons</text>

    <text x="480" y="548" font-size="13" fill="#82859f">Decision support only: every alert is reviewed by an advisor before any action is taken.</text>
  </g>
</svg>
